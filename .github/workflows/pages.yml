name: Deploy GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm run build
      - name: Verify generated portal
        run: |
          set -eu
          test "$(find dist -name index.html | wc -l)" -eq "$(node -p 'require("./data/games.json").length + 1')"
          test -s dist/games/tenpop/index.html
          test -s dist/games/tenpuzzle/index.html
          grep -q 'GAME 10' dist/index.html
          grep -q 'GAME 08' dist/index.html
          grep -q './games/tenpop/' dist/index.html
          grep -q 'https://asumax1128.github.io/tenpop/' dist/index.html
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
      - name: Verify live Pages content with curl
        run: |
          set -eu
          url="https://asumax1128.github.io/minami-portal/"
          for attempt in 1 2 3 4 5 6; do
            curl -fsSL --retry 2 --max-time 20 -H 'Cache-Control: no-cache' "${url}?verify=${GITHUB_SHA}" -o /tmp/minami-live.html
            if grep -q 'GAME 08' /tmp/minami-live.html &&
               grep -q 'GAME 10' /tmp/minami-live.html &&
               grep -q 'TEN POP' /tmp/minami-live.html &&
               grep -q 'https://asumax1128.github.io/tenpop/' /tmp/minami-live.html; then
              echo "LIVE OK: GAME 08, ELEVEN GAMES, and TEN POP PLAY URL"
              wc -c /tmp/minami-live.html
              curl -fsSL --retry 2 --max-time 20 "${url}games/tenpop/?verify=${GITHUB_SHA}" -o /tmp/minami-tenpop.html
              grep -q 'TEN POP' /tmp/minami-tenpop.html
              grep -q 'gallery-tenpop' /tmp/minami-tenpop.html
              for asset in assets/logos/tenpop-logo.png assets/logos/tenpop-logo.webp assets/screenshots/tenpop/tenpop-howto.jpeg assets/screenshots/tenpop/tenpop-howto.webp assets/screenshots/tenpop/tenpop-play.jpeg assets/screenshots/tenpop/tenpop-play.webp assets/screenshots/tenpop/tenpop-combo.jpeg assets/screenshots/tenpop/tenpop-combo.webp; do
                curl -fsSL --retry 2 --max-time 20 "${url}${asset}?verify=${GITHUB_SHA}" -o /dev/null
              done
              echo "LIVE OK: TEN POP detail and all original/display assets"
              curl -fsSL --retry 2 --max-time 20 "${url}games/tenpuzzle/?verify=${GITHUB_SHA}" -o /tmp/minami-tenpuzzle.html
              grep -q 'gallery-tenpuzzle' /tmp/minami-tenpuzzle.html
              grep -q 'https://asumax1128.github.io/tenpuzzle/' /tmp/minami-tenpuzzle.html
              for asset in assets/logos/tenpuzzle-logo.jpg assets/logos/tenpuzzle-logo.webp assets/screenshots/tenpuzzle/tenpuzzle-play.png assets/screenshots/tenpuzzle/tenpuzzle-play.webp assets/screenshots/tenpuzzle/tenpuzzle-result.png assets/screenshots/tenpuzzle/tenpuzzle-result.webp assets/screenshots/tenpuzzle/tenpuzzle-zukan.png assets/screenshots/tenpuzzle/tenpuzzle-zukan.webp; do
                curl -fsSL --retry 2 --max-time 20 "${url}${asset}?verify=${GITHUB_SHA}" -o /dev/null
              done
              echo "LIVE OK: featured section and TEN PUZZLE detail/assets"
              exit 0
            fi
            echo "Live Pages is not updated yet (attempt ${attempt}/6)"
            sleep 10
          done
          echo "ERROR: deployed Pages content is missing required TEN POP markers"
          exit 1
