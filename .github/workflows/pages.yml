name: Deploy GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm run build
      # The hand-maintained root index.html contains the latest game cards.
      # The legacy builder still generates a separate index from data/games.json;
      # publish the main-branch index instead of silently reverting to it.
      - name: Publish current main index
        run: |
          cp index.html dist/index.html
          test -s dist/index.html
          grep -q 'GAME 08' dist/index.html
          grep -q 'EIGHT GAMES' dist/index.html
          grep -q 'https://asumax1128.github.io/tenpop/' dist/index.html
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
      - name: Verify live Pages content with curl
        run: |
          set -eu
          url="https://asumax1128.github.io/minami-portal/"
          for attempt in 1 2 3 4 5 6; do
            curl -fsSL --retry 2 --max-time 20 -H 'Cache-Control: no-cache' "${url}?verify=${GITHUB_SHA}" -o /tmp/minami-live.html
            if grep -q 'GAME 08' /tmp/minami-live.html &&
               grep -q 'EIGHT GAMES' /tmp/minami-live.html &&
               grep -q 'https://asumax1128.github.io/tenpop/' /tmp/minami-live.html; then
              echo "LIVE OK: GAME 08, EIGHT GAMES, and TEN POP PLAY URL"
              wc -c /tmp/minami-live.html
              exit 0
            fi
            echo "Live Pages is not updated yet (attempt ${attempt}/6)"
            sleep 10
          done
          echo "ERROR: deployed Pages content is missing required TEN POP markers"
          exit 1
