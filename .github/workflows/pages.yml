name: Deploy GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm run build
      # The hand-maintained root index.html contains the latest game cards.
      # The legacy builder still generates a separate index from data/games.json;
      # publish the main-branch index instead of silently reverting to it.
      - name: Publish current main index
        run: |
          cp index.html dist/index.html
          test -s dist/index.html
          grep -q 'GAME 08' dist/index.html
          grep -q 'EIGHT GAMES' dist/index.html
          grep -q 'https://asumax1128.github.io/tenpop/' dist/index.html
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
